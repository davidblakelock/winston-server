name: Deploy to Railway
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Railway via API
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          RESULT=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation { serviceInstanceDeployV2(serviceId: \\\"d7f3e146-d70a-418d-8191-91ec15d4c205\\\", environmentId: \\\"3b44b7cc-b4de-4891-be2a-903847540da3\\\", commitSha: \\\"$COMMIT_SHA\\\") }\"}" \
            https://backboard.railway.com/graphql/v2)
          echo "Railway response: $RESULT"
