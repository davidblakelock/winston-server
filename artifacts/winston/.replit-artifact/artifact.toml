kind = "web"
  previewPath = "/"
  title = "Winston"
  version = "1.0.0"
  id = "artifacts/winston"
  router = "path"

  [[integratedSkills]]
  name = "react-vite"
  version = "1.0.0"

  [[services]]
  name = "web"
  paths = [ "/" ]
  localPort = 20925

  [services.development]
  run = "pnpm --filter @workspace/winston run dev"

  [services.production]
  serve = "static"
  publicDir = "artifacts/winston/dist/public"

  [services.production.build]
  args = ["pnpm", "--filter", "@workspace/winston", "run", "build"]

  [services.production.build.env]
  NODE_ENV = "production"
  PORT = "8080"
  BASE_PATH = "/"

  [services.env]
  PORT = "20925"
  BASE_PATH = "/"
  